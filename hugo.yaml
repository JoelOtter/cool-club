baseURL: 'https://join-the-cool.club'
languageCode: 'en-gb'
title: '🧊 Club'
disableKinds:
  - taxonomy

markup:
  highlight:
    noClasses: false

outputFormats:
  next_link:
    baseName: next
    mediaType: text/html
    isHTML: true
  prev_link:
    baseName: prev
    mediaType: text/html
    isHTML: true

enableGitInfo: true

frontmatter:
  lastmod:
  - ':git'
  - ':fileModTime'